name: Spec Audit

# Runs on every pull request targeting main. No paths-ignore so adding an AC
# without a matching step definition is always caught.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: spec-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-audit:
    name: Spec ↔ Test Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spec audit
        run: node packages/tooling/src/audit-spec-links.mjs
