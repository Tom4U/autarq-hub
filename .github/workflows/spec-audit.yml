name: Spec Audit

# Runs on every pull request targeting main. No paths-ignore so adding an AC
# without a matching step definition is always caught.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: spec-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-audit:
    name: Spec ↔ Test Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spec audit
        run: node packages/tooling/src/audit-spec-links.mjs
