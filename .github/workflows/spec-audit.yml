name: Spec Audit

# Runs on every pull request targeting main. No paths-ignore so adding an AC
# without a matching step definition is always caught.

on:
  pull_request:
    branches:
      - main

concurrency:
  group: spec-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-audit:
    name: Spec ↔ Test Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run spec audit
        run: node packages/tooling/src/audit-spec-links.mjs
