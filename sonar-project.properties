sonar.projectKey=tom4u_autarq-hub
sonar.organization=tom4u

sonar.sources=apps/web/app,packages/core/src,packages/db/src,packages/connectors/src,packages/ui/src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/vitest.setup.ts,\
  **/scripts/**,\
  packages/tooling/**

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.spec.ts

sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/vitest.setup.ts,\
  **/scripts/**,\
  packages/tooling/**

sonar.javascript.lcov.reportPaths=coverage/tooling/lcov.info,coverage/core/lcov.info,coverage/web/lcov.info

sonar.sourceEncoding=UTF-8
